<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFF6B8"/>
      <stop offset="25%"  stop-color="#E8C766"/>
      <stop offset="50%"  stop-color="#D4AF37"/>
      <stop offset="75%"  stop-color="#A87F1E"/>
      <stop offset="100%" stop-color="#6E4F0E"/>
    </linearGradient>

    <linearGradient id="goldStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFF3A0"/>
      <stop offset="50%"  stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#FFF3A0"/>
    </linearGradient>

    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%">
      <stop offset="0%"   stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>

  <!-- الخلفية -->
  <rect width="512" height="512" rx="96" fill="url(#bgGlow)"/>

  <!-- التاج -->
  <path d="M96 178
           L138 78
           L200 148
           L256 58
           L312 148
           L374 78
           L416 178
           L406 226
           L106 226 Z"
        fill="url(#goldGrad)"
        stroke="url(#goldStroke)"
        stroke-width="4"
        stroke-linejoin="round"/>

  <!-- كرات التاج -->
  <circle cx="138" cy="66" r="16" fill="url(#goldGrad)" stroke="url(#goldStroke)" stroke-width="3"/>
  <circle cx="256" cy="46" r="16" fill="url(#goldGrad)" stroke="url(#goldStroke)" stroke-width="3"/>
  <circle cx="374" cy="66" r="16" fill="url(#goldGrad)" stroke="url(#goldStroke)" stroke-width="3"/>

  <!-- الدرع -->
  <path d="M256 232
           L402 268
           Q420 388 256 472
           Q92 388 110 268
           Z"
        fill="none"
        stroke="url(#goldStroke)"
        stroke-width="10"
        stroke-linejoin="round"/>

  <!-- حرف H -->
  <path d="M196 300 L196 418
           M316 300 L316 418
           M196 358 L316 358"
        stroke="url(#goldGrad)"
        stroke-width="30"
        stroke-linecap="square"
        stroke-linejoin="miter"
        fill="none"/>
</svg>
